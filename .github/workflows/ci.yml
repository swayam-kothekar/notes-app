name: CI Pipeline

on:
  pull_request:
    branches:
      - main
      - develop

jobs:
  build:
    name: Install & Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: Install dependencies
        run: npm install

      - name: Run build check
        run: npm run build